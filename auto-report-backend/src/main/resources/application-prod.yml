spring:
  profiles:
    active: prod

app:
  misf-login:
    lock-url: ${MISF_LOGIN_LOCK_URL:}
  auth:
    username: ${APP_AUTH_USERNAME:}
    password: ${APP_AUTH_PASSWORD:}
    keycloak:
      enabled: ${KEYCLOAK_ENABLED:true}
      base-url: ${KEYCLOAK_BASE_URL:}
      realm: ${KEYCLOAK_REALM:}
      client-id: ${KEYCLOAK_CLIENT_ID:}
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}
    login-fail:
      url: ${LOGIN_FAIL_URL:}
    jwt:
      secret: ${APP_JWT_SECRET:}
      expire-minutes: ${APP_JWT_EXPIRE_MINUTES:120}
    captcha:
      length: ${APP_CAPTCHA_LENGTH:6}
      ttl-seconds: ${APP_CAPTCHA_TTL_SECONDS:300}