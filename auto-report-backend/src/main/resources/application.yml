spring:
  application:
    name: auto-report-backend
  datasource:
    url: "${MSSQL_URL:jdbc:sqlserver://192.168.28.188:1433;databaseName=eservice_jd;encrypt=true;trustServerCertificate=true}"
    username: ${MSSQL_USERNAME:SA}
    password: ${MSSQL_PASSWORD:SA@123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: MssqlHikariPool
  # 第二資料源（SQL Server：ESERVICE_ADM），供 Role / UserRole / UserEntity 使用
  datasource-secondary:
    url: "${MSSQL_SECONDARY_URL:jdbc:sqlserver://192.168.28.188:1433;databaseName=ESERVICE_ADM;encrypt=true;trustServerCertificate=true}"
    username: ${MSSQL_SECONDARY_USERNAME:SA}
    password: ${MSSQL_SECONDARY_PASSWORD:SA@123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      pool-name: MssqlSecondaryHikariPool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none                # 不使用 Hibernate 管理 schema
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServer2012Dialect
  servlet:
    multipart:
      max-file-size: 10MB           # 單一附件上限
      max-request-size: 100MB       # 單次請求（多檔）上限
  # Redis：驗證碼逾時控制 + Session 儲存
  redis:
    host: ${REDIS_HOST:192.168.28.188}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:123456}
    timeout: 3000ms
    database: 3
  session:
    store-type: redis
    timeout: 30m
    redis:
      repository-type: default   # 使用 RedisSessionRepository（不額外維護 session 索引）

# OpenSearch 持久层（与 SQL Server / JPA 并存）
opensearch:
  host: ${OPENSEARCH_HOST:192.168.28.132}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USERNAME:admin}          # 空 = 不启用认证
  password: ${OPENSEARCH_PASSWORD:Txz123456..}

app:
  opensearch:
    auto-create-index: ${OPENSEARCH_AUTO_CREATE:true}   # 启动时自动创建索引与 mapping（测试关闭）
  misf-login:
    lock-url: ${MISF_LOGIN_LOCK_URL:http://localhost:8083/eservice_api/autoMonitoring/lockAccount}   # 手動處理 MISF_LOGIN 鎖定帳號的外部 API（POST JSON {userId,status}），留空則跳過
  auth:
    username: ${APP_AUTH_USERNAME:xianzhi88889}   # 固定登入帳號（keycloak.enabled=false 時使用）
    password: ${APP_AUTH_PASSWORD:xianzhi88889}   # 固定登入密碼（keycloak.enabled=false 時使用）
    keycloak:
      enabled: ${KEYCLOAK_ENABLED:true}                        # true = 以 Keycloak 驗證帳密；false = 使用上方固定帳密
      base-url: ${KEYCLOAK_BASE_URL:http://192.168.28.188:8888/auth}     # Keycloak base URL
      realm: ${KEYCLOAK_REALM:elife_jdzq}                 # realm 名稱
      client-id: ${KEYCLOAK_CLIENT_ID:eservice_jd} # client id（需開啟 Direct Access Grants）
      client-secret: ${KEYCLOAK_CLIENT_SECRET:}                # public client 留空；confidential client 才需填
    login-fail:
      url: ${LOGIN_FAIL_URL:http://localhost:8083/eservice_api/MIS/updateLoginStatus}   # 登入失敗通知 API（POST JSON = User 物件），留空則不呼叫（best-effort）
    jwt:
      secret: ${APP_JWT_SECRET:auto-monitoring-default-jwt-secret-please-override-in-production-2026}   # HS256 密鑰（至少 32 bytes）
      expire-minutes: ${APP_JWT_EXPIRE_MINUTES:120}   # token 有效時間（分鐘）
    captcha:
      length: ${APP_CAPTCHA_LENGTH:6}                 # 驗證碼位數
      ttl-seconds: ${APP_CAPTCHA_TTL_SECONDS:300}     # 驗證碼逾時（秒）

logging:
  level:
    com.twfhclife.autoreport: INFO

server:
  port: 8881                          # 後端 API 端口（前端 dev proxy 指向此端口）
